name: Bug report
description: Report incorrect behavior in the schema, CLI, exporter, or generated output.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use fictional or public data. Remove credentials and private material.
      render: yaml
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Provenance version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: Node 24.8.0 on macOS
    validations:
      required: true
